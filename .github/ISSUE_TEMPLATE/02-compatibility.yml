name: Compatibility report
description: Tell us which setup you tested and what worked or failed.
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. A partial or failed test is useful too; report only what you observed.
        Do not include private desktop content or contact details.
  - type: input
    id: version
    attributes:
      label: Release or commit tested
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Windows/Python versions, game/theme, grid dimensions, monitor resolution/scaling, browser zoom and capture mode.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Works in the actions I tested
        - Partly works
        - Does not work
        - Could not complete setup
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: Actions actually tested
      description: Leave untested items unchecked; this is not a promise about other configurations.
      options:
        - label: Installed from a fresh source download and new environment.
        - label: Checked the preview against the visible board.
        - label: Confirmed clicks pass through the overlay.
        - label: Placing a flag removes the corresponding mine marker.
        - label: Revealing a new clue updates the hints.
        - label: F8 pauses and resumes; F9 closes the helper.
        - label: Tested selection on a secondary monitor with different display scaling.
  - type: textarea
    id: notes
    attributes:
      label: Notes and evidence
      description: Describe any limits or failures. A cropped board image is welcome.
    validations:
      required: false
