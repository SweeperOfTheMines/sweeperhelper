name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: . # Change when application files live in a subfolder.
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up standard 64-bit Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Verify application and test inputs are present
        run: |
          $required = @(
            'minesweeper_helper.py',
            'requirements.txt',
            'test_helper.py',
            'test_recognition.py',
            'test_data/classic_screenshot.png'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required input: $path. Check your repository layout and v2 test files."
            }
          }
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install pinned project requirements
        run: python -m pip install -r requirements.txt
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Run solver and screenshot regression tests
        run: python -m unittest -v test_helper.py test_recognition.py
      # This is NOT a live desktop capture / click-through / mixed-DPI test.
